name: release

# Tag builds only: a push to main must never publish anything. This
# workflow triggers only on a "v*" tag.
on:
  push:
    tags:
      - "v*"

# contents: write is needed to create the GitHub release and upload
# archives/checksums to it.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Same checks as every PR (make lint test), run once more against the
      # exact commit being tagged, before anything is built or published.
      - name: make lint test
        run: make lint test

      # TAP_REPO is the one variable, defined once, that names the
      # Homebrew tap repository. GoReleaser's "brews" block needs owner
      # and name as two separate fields, so this step is the only place
      # that splits it.
      - name: Set the Homebrew tap owner and name from TAP_REPO
        run: |
          TAP_REPO="agentpulsesoftware/homebrew-tap"
          echo "TAP_OWNER=${TAP_REPO%%/*}" >> "$GITHUB_ENV"
          echo "TAP_NAME=${TAP_REPO#*/}" >> "$GITHUB_ENV"

      # SIGN is set only when a Developer ID certificate secret exists.
      # While no certificate is configured this stays unset and the build
      # runs the fully unsigned path. Checking a secret's
      # presence has to happen through "env", not directly in "if:" —
      # GitHub Actions does not expose the "secrets" context there.
      - name: Determine whether signing is configured
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT_P12_BASE64" ]; then
            echo "SIGN=1" >> "$GITHUB_ENV"
          fi

      - name: Import the Developer ID certificate
        if: ${{ env.SIGN == '1' }}
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/agentpulse-release-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086 # existing_keychains is a
          # space-separated list of paths security expects as separate
          # arguments, not one quoted string.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $existing_keychains
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Write the App Store Connect API key
        if: ${{ env.SIGN == '1' }}
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_OWNER: ${{ env.TAP_OWNER }}
          TAP_NAME: ${{ env.TAP_NAME }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Remove the temporary signing keychain
        if: ${{ always() && env.SIGN == '1' }}
        run: security delete-keychain "$RUNNER_TEMP/agentpulse-release-signing.keychain-db" || true

      # The PyPI half of packaging: wraps the binaries GoReleaser just
      # built.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build and check wheels
        run: |
          python3 -m venv "$RUNNER_TEMP/pypi-tools"
          "$RUNNER_TEMP/pypi-tools/bin/pip" install -q build==1.6.1 hatchling==1.32.0 twine==7.0.0
          "$RUNNER_TEMP/pypi-tools/bin/python" packaging/pypi/build_wheels.py \
            --dist dist --out dist/wheels --version "${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/pypi-tools/bin/twine" check dist/wheels/*.whl

      # PYPI_API_TOKEN is read only here, never echoed or written to a
      # file. Skips cleanly while no token is configured (same gating
      # style as SIGN above), so the pipeline stays provable.
      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN is not set; skipping the PyPI publish."
            exit 0
          fi
          "$RUNNER_TEMP/pypi-tools/bin/twine" upload --non-interactive \
            --disable-progress-bar dist/wheels/*.whl

      - name: "Binary sizes (NFR-05: each must be under 15 MB)"
        if: always()
        run: |
          {
            echo "### Binary sizes (NFR-05: must be under 15 MB)"
            echo
            for f in dist/agentpulse_*/agentpulse; do
              [ -f "$f" ] || continue
              size=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")
              echo "- $(basename "$(dirname "$f")"): ${size} bytes"
              if [ "$size" -ge 15728640 ]; then
                echo "::error::$(basename "$(dirname "$f")") is ${size} bytes, over the 15 MB NFR-05 limit"
                exit 1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
